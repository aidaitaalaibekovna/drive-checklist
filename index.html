<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Drive Taxi — Фиксация смены</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: #e8ecf2;
      margin: 0;
      padding: 20px 12px;
      color: #2d3748;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    
    .neu-card {
      background: #e8ecf2;
      border-radius: 28px;
      padding: 24px 20px;
      box-shadow: 12px 12px 24px #c5cbd5, -12px -12px 24px #ffffff;
      max-width: 440px;
      width: 100%;
    }

    .header-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .brand-title {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #1a202c;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .neu-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      background: #e8ecf2;
      box-shadow: inset 3px 3px 6px #c5cbd5, inset -3px -3px 6px #ffffff;
      color: #4a5568;
    }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 800; margin-bottom: 8px; color: #4a5568; text-transform: uppercase; letter-spacing: 0.5px; }
    
    select, input[type="number"] {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 16px;
      background: #e8ecf2;
      box-shadow: inset 4px 4px 8px #c5cbd5, inset -4px -4px 8px #ffffff;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      color: #1a202c;
    }

    .neu-task-row {
      background: #e8ecf2;
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 5px 5px 10px #c5cbd5, -5px -5px 10px #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .task-label { font-size: 13px; font-weight: 600; color: #2d3748; line-height: 1.35; }

    .toggle-group { display: flex; gap: 8px; flex-shrink: 0; }
    .toggle-btn {
      border: none;
      background: #e8ecf2;
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 800;
      color: #718096;
      box-shadow: 4px 4px 8px #c5cbd5, -4px -4px 8px #ffffff;
      transition: all 0.15s ease;
    }
    .toggle-btn.active-yes {
      background: #10b981;
      color: #ffffff;
      box-shadow: inset 3px 3px 6px #047857, inset -3px -3px 6px #34d399;
    }
    .toggle-btn.active-no {
      background: #ef4444;
      color: #ffffff;
      box-shadow: inset 3px 3px 6px #b91c1c, inset -3px -3px 6px #f87171;
    }

    .section-badge {
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      margin: 16px 0 8px 0;
      color: #3b82f6;
      letter-spacing: 0.5px;
    }
    .num-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .num-card {
      background: #e8ecf2;
      padding: 12px;
      border-radius: 16px;
      box-shadow: 5px 5px 10px #c5cbd5, -5px -5px 10px #ffffff;
    }
    .num-card label { font-size: 11px; margin-bottom: 6px; }

    .geo-panel {
      margin-bottom: 16px;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 11px;
      color: #4a5568;
      box-shadow: inset 3px 3px 6px #c5cbd5, inset -3px -3px 6px #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .geo-btn {
      background: #e8ecf2;
      border: none;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      color: #2563eb;
      cursor: pointer;
      box-shadow: 3px 3px 6px #c5cbd5, -3px -3px 6px #ffffff;
    }
